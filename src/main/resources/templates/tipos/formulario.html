<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{plantilla/base :: estructura(~{::title}, ~{::main})}">
    <head><title th:text="${tipoServicio.id == null} ? #{tipo.nuevo} : #{tipo.editar}">Tipo de servicio</title></head>
    <body>
        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card vet-card">
                        <div class="card-header vet-thead">
                            <h2 class="h5 mb-0" th:text="${tipoServicio.id == null} ? #{tipo.nuevo} : #{tipo.editar}">Tipo</h2>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/tipos/guardar}" th:object="${tipoServicio}" method="post" novalidate="novalidate">
                                <input type="hidden" th:field="*{id}"/>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">[[#{tipo.nombre}]]</label>
                                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                                           th:errorclass="is-invalid" maxlength="100"/>
                                    <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                                </div>
                                <div class="mb-3">
                                    <label for="descripcion" class="form-label">[[#{tipo.descripcion}]]</label>
                                    <textarea id="descripcion" class="form-control" rows="3" th:field="*{descripcion}"
                                              th:errorclass="is-invalid" maxlength="255"></textarea>
                                    <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
                                </div>
                                <div class="d-flex justify-content-end gap-2">
                                    <a class="btn btn-outline-secondary" th:href="@{/tipos}">[[#{accion.cancelar}]]</a>
                                    <button type="submit" class="btn btn-vet"><i class="fa-solid fa-floppy-disk me-1"></i>[[#{accion.guardar}]]</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
