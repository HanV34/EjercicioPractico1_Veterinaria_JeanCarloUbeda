<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{plantilla/base :: estructura(~{::title}, ~{::main})}">
    <head><title th:text="${servicio.id == null} ? #{servicio.nuevo} : #{servicio.editar}">Servicio</title></head>
    <body>
        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card vet-card">
                        <div class="card-header vet-thead">
                            <h2 class="h5 mb-0" th:text="${servicio.id == null} ? #{servicio.nuevo} : #{servicio.editar}">Servicio</h2>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post" novalidate="novalidate">
                                <input type="hidden" th:field="*{id}"/>
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">[[#{servicio.nombre}]]</label>
                                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                                           th:errorclass="is-invalid" maxlength="100"/>
                                    <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                                </div>
                                <div class="mb-3">
                                    <label for="tipoServicio" class="form-label">[[#{servicio.tipo}]]</label>
                                    <select id="tipoServicio" class="form-select" th:field="*{tipoServicio.id}"
                                            th:classappend="${#fields.hasErrors('tipoServicio')} ? 'is-invalid'">
                                        <option value="" th:text="#{servicio.seleccione}">Seleccione…</option>
                                        <option th:each="t : ${tiposDisponibles}" th:value="${t.id}" th:text="${t.nombre}">Tipo</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('tipoServicio')}" th:errors="*{tipoServicio}">Error</div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="precio" class="form-label">[[#{servicio.precio}]] (₡)</label>
                                        <input type="number" id="precio" step="0.01" min="0" class="form-control"
                                               th:field="*{precio}" th:errorclass="is-invalid"/>
                                        <div class="invalid-feedback" th:errors="*{precio}">Error</div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="duracionMinutos" class="form-label">[[#{servicio.duracionMinutos}]]</label>
                                        <input type="number" id="duracionMinutos" step="1" min="1" class="form-control"
                                               th:field="*{duracionMinutos}" th:errorclass="is-invalid"/>
                                        <div class="invalid-feedback" th:errors="*{duracionMinutos}">Error</div>
                                    </div>
                                </div>
                                <div class="d-flex justify-content-end gap-2">
                                    <a class="btn btn-outline-secondary" th:href="@{/servicios}">[[#{accion.cancelar}]]</a>
                                    <button type="submit" class="btn btn-vet"><i class="fa-solid fa-floppy-disk me-1"></i>[[#{accion.guardar}]]</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
