spring.application.name=veterinaria
server.port=8086

# Base de datos local (MySQL) creada con script_veterinaria.sql
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_citas?useSSL=false&serverTimezone=America/Guatemala&allowPublicKeyRetrieval=true
spring.datasource.username=usuario_caso_practico_01_var
spring.datasource.password=123456
